# CI y despliegue con el pipeline central (EcosistemaUNP/cicd-workflows).
name: CI y despliegue

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    uses: EcosistemaUNP/cicd-workflows/.github/workflows/pipeline-django.yml@v1
    with:
      rama-desarrollo: dev
      rama-pruebas: main
      settings: sgai.settings
      base-datos: postgis
